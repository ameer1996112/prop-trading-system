name: phase0-verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            apps/observation-edge/package-lock.json
            apps/operations-console/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.21"
          enable-cache: true
      - name: Bootstrap locked dependencies
        run: make bootstrap
      - name: Verify paper-only schema-3.1 loop
        run: make verify-paper-loop-core
      - name: Verify remaining Phase 0 proof
        run: make verify-observation-core
