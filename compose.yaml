services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: phase0
      POSTGRES_USER: phase0
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - phase0-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phase0 -d phase0"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${PHASE0_POSTGRES_PORT:-55432}:5432"

  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      PTS_APP_ENVIRONMENT: foundation
      PTS_DATABASE_HOST: postgres
      PTS_DATABASE_PORT: "5432"
      PTS_DATABASE_NAME: phase0
      PTS_DATABASE_USER: phase0
      PTS_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PTS_APP_ENVIRONMENT: foundation
      PTS_PHASE0_EVIDENCE_PATH: /app/evidence/phase0/evidence-registry.json
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${PHASE0_API_PORT:-8000}:8000"

  operations-console:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      PHASE0_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PHASE0_CONSOLE_PORT:-3000}:3000"

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./config/local/postgres_password.txt}

volumes:
  phase0-postgres:
